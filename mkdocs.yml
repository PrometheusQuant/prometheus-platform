site_name: PrometheusQuant
site_description: "Plataforma de trading multiestrategia: datos, investigación, backtesting, paper y ejecución en vivo."
site_url: https://prometheusquant.github.io/prometheus-platform/
repo_url: https://github.com/PrometheusQuant/prometheus-platform
repo_name: PrometheusQuant/prometheus-platform
edit_uri: edit/develop/docs/
copyright: Copyright © 2026 PrometheusQuant · Apache-2.0
docs_dir: docs
strict: true

theme:
  name: material
  language: es
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

# Un documento que no está en `nav` se publica igual (se llega por enlaces) y solo genera un
# aviso informativo; así un PR de docs no rompe el build por no tocar este archivo.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Inicio: README.md
  - Arquitectura:
      - arquitectura/README.md
      - Diagramas C4: arquitectura/c4.md
      - Estructura de directorios: arquitectura/estructura-de-directorios.md
  - Decisiones (ADR):
      - adr/README.md
      - "0001 Monolito modular hexagonal": adr/0001-monolito-modular-hexagonal.md
      - "0002 uv como gestor de entornos": adr/0002-uv-como-gestor-de-entornos.md
      - "0003 Lakehouse Parquet + DuckDB": adr/0003-lakehouse-parquet-duckdb.md
      - "0004 CRISP-ML(Q) con protocolo financiero": adr/0004-crisp-mlq-con-protocolo-financiero.md
      - "0005 Orden de estrategias": adr/0005-orden-de-estrategias.md
      - "0006 NautilusTrader para ejecución": adr/0006-nautilustrader-para-ejecucion.md
      - "0007 MkDocs Material para la documentación": adr/0007-mkdocs-material-para-la-documentacion.md
      - Plantilla: adr/0000-plantilla.md
  - Metodología:
      - metodologia/README.md
      - Definición de Listo y Terminado: metodologia/definicion-de-listo-y-terminado.md
  - Estrategias: estrategias/README.md
  - Compliance:
      - compliance/README.md
      - Binance: compliance/binance.md
  - Runbooks: runbooks/README.md
  - Investigación:
      - investigacion/README.md
      - "2026-10-16 Plataforma multiestrategia": investigacion/2026-10-16-plataforma-multiestrategia.md
      - "2026-10-23 Auditoría de Data Vision": investigacion/2026-10-23-auditoria-binance-data-vision.md
      - Notas:
          - investigacion/notas/README.md
          - Acceso y regulación en Bolivia: investigacion/notas/acceso_regulacion_bolivia.md
          - Arquitectura y stack: investigacion/notas/arquitectura_y_stack.md
          - Edges cripto cuantitativos: investigacion/notas/edges_cripto_cuantitativos.md
          - Edges alternativos y contradicciones: investigacion/notas/edges_alternativos_y_contradicciones.md
          - Metodología y Jira: investigacion/notas/metodologia_y_jira.md
  - Académico: academico/README.md
