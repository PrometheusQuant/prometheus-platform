name: Imagen

# Publica la imagen del dashboard en GHCR, con su SBOM (CycloneDX) y firmada con cosign sin clave
# (OIDC de GitHub). Lo que se despliega en la VM pasa antes por deploy/verificar-imagen.sh (PQ-81).
on:
  push:
    branches: [develop, main]
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - "src/**"
      - deploy/verificar-imagen.sh
      - .github/workflows/imagen.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/prometheusquant/pq-dashboard

jobs:
  publicar:
    name: Construir, publicar, firmar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # publicar en GHCR
      id-token: write # certificado efímero de Sigstore (firma sin clave)
    steps:
      - uses: actions/checkout@v7
      # La VM de Oracle es A1 (arm64) y la laptop es amd64.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
      - id: build
        name: Construir y publicar (amd64 y arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM CycloneDX de la imagen publicada
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGEN }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v4
      - name: Firmar la imagen y adjuntarle el SBOM como atestación
        env:
          REF: ${{ env.IMAGEN }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - name: Verificar como lo hará la VM antes de desplegar
        run: deploy/verificar-imagen.sh "${IMAGEN}@${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-pq-dashboard
          path: sbom.cdx.json
          retention-days: 90
