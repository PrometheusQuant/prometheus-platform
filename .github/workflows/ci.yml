name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (lint, tipos, arquitectura, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Instalar dependencias (lockfile congelado)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Tipos (mypy estricto)
        run: uv run mypy
      - name: Arquitectura hexagonal (import-linter)
        run: uv run lint-imports
      - name: Tests y cobertura
        run: uv run pytest --cov-report=xml

  dependencies:
    name: Dependencias sin vulnerabilidades conocidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Auditar el uv.lock con pip-audit (OWASP A03, cadena de suministro)
        run: make audit

  dashboard-image:
    name: Imagen Docker del dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen
        run: docker build -t pq-dashboard:ci .
      - name: Arrancar en solo lectura y comprobar que responde
        run: |
          mkdir -p empty-data
          docker run -d --name pq --read-only --tmpfs /tmp --cap-drop ALL \
            -v "$PWD/empty-data:/data:ro" -p 127.0.0.1:8501:8501 pq-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs pq
          exit 1
      - uses: astral-sh/setup-uv@v7
      - name: Pruebas en navegador real (Playwright, PQ-41)
        run: |
          uv sync --locked --only-group e2e
          # Sin --with-deps: el runner ya trae las librerías de Chrome y apt-get tardaba hasta 11 min.
          uv run --no-sync playwright install chromium
          uv run --no-sync pytest tests/e2e -p no:cacheprovider \
            --base-url http://127.0.0.1:8501 -o addopts="-ra --strict-markers --import-mode=importlib"

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (historial completo)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact --verbose
