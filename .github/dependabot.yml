version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: build
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: ci
