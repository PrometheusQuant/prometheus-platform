# Prometheus del paper trading (PQ-71). Todo escucha en 127.0.0.1: se llega por túnel SSH.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: pq-runner        # `pq paper run --metrics-port 9108`
    static_configs:
      - targets: ["127.0.0.1:9108"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
